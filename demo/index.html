<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Visual Diff Demo</title>
    <style>
      :root{color-scheme:light}
      html,body{height:100%;overflow:hidden}
      body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#fff}
      .shell{height:100vh;display:flex;flex-direction:column}
      .panel{background:#fff;border:0;border-radius:0;box-shadow:none}
      .intro{padding:16px 20px 12px}
      .intro h1{margin:0 0 8px;font-size:28px;line-height:1.1}
      .intro p{margin:0;color:#526075;line-height:1.6}
      .viewer-shell{flex:1;min-height:0;padding:0}
      #viewer{height:100%}
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="panel intro">
        <h1>Rendered HTML/CSS Diff</h1>
        <p>A fixed example showing side-by-side rendering, diff highlights, spacer alignment, and synchronized scrolling.</p>
      </section>
      <section class="panel viewer-shell">
        <div id="viewer"></div>
      </section>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
