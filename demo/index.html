<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Visual Diff Demo</title>
    <style>
      :root{color-scheme:light}
      body{margin:0;padding:20px;background:radial-gradient(circle at top,#fdf6e3 0,#eef4ff 42%,#dde7f2 100%);font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#172033}
      .shell{max-width:1400px;margin:0 auto}
      .hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:18px;align-items:start;margin-bottom:18px}
      .panel{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border:1px solid rgba(23,32,51,.08);border-radius:20px;box-shadow:0 18px 55px rgba(28,39,58,.12)}
      .intro{padding:22px 24px}
      .intro h1{margin:0 0 10px;font-size:32px;line-height:1.05;letter-spacing:-.03em}
      .intro p{margin:0;color:#4b5567;line-height:1.6}
      .intro strong{color:#172033}
      .scenario-card{padding:18px 20px}
      .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:14px}
      .field{display:flex;flex-direction:column;gap:6px}
      .field span,.viewer-head span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#60708a}
      select,textarea{width:100%;box-sizing:border-box;border:1px solid #ccd7e5;border-radius:12px;background:#fff;color:#182235}
      select{padding:10px 12px;min-width:220px}
      textarea{min-height:170px;padding:12px 14px;font-family:Consolas,Monaco,monospace;resize:vertical}
      button{padding:11px 18px;border:0;border-radius:999px;background:linear-gradient(135deg,#0f766e,#1d4ed8);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 10px 24px rgba(29,78,216,.24)}
      button:hover{filter:brightness(1.04)}
      .meta{margin-top:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(15,118,110,.08),rgba(29,78,216,.08));color:#40506a;line-height:1.6}
      .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
      .editor{padding:18px}
      .viewer-shell{padding:18px}
      .viewer-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}
      .viewer-note{font-size:13px;color:#5d6d86}
      #viewer{height:70vh;min-height:520px}
      @media(max-width:980px){.hero,.grid{grid-template-columns:1fr}#viewer{height:62vh;min-height:420px}}
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="hero">
        <div class="panel intro">
          <h1>Rendered HTML/CSS Diff</h1>
          <p>这个 demo 只演示两栏真实渲染、差异高亮、spacer 对齐和同步滚动。你可以直接切换预设场景，或继续手改下方 HTML/CSS 看渲染结果如何变化。</p>
          <div class="toolbar">
            <label class="field">
              <span>Scenario</span>
              <select id="scenario"></select>
            </label>
            <button id="compare">Render Compare</button>
          </div>
        </div>
        <aside class="panel scenario-card">
          <span>Current Focus</span>
          <div class="meta" id="scenarioDescription"></div>
        </aside>
      </section>

      <section class="panel editor">
        <div class="grid">
          <label class="field">
            <span>Old HTML</span>
            <textarea id="oldHtml"></textarea>
          </label>
          <label class="field">
            <span>New HTML</span>
            <textarea id="newHtml"></textarea>
          </label>
          <label class="field">
            <span>Old CSS</span>
            <textarea id="oldCss"></textarea>
          </label>
          <label class="field">
            <span>New CSS</span>
            <textarea id="newCss"></textarea>
          </label>
        </div>
      </section>

      <section class="panel viewer-shell">
        <div class="viewer-head">
          <span>Viewer</span>
          <div class="viewer-note">开启对齐和同步滚动后，新增/删除 block 会通过 spacer 尽量保持两栏位置对应。</div>
        </div>
        <div id="viewer"></div>
      </section>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
