<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Visual Diff Demo</title>
    <style>
      body{margin:0;padding:6px 24px;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
      .editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px;margin-bottom:6px}
      textarea{width:100%;min-height:144px;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-family:Consolas,Monaco,monospace;box-sizing:border-box}
      #viewer .hvd-root{width:100%}
      #viewer .hvd-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
      #viewer .hvd-pane{min-width:0;padding:0}
      #viewer .hvd-content{max-width:100%;margin:0}
      button{margin-bottom:6px;padding:8px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
      @media(max-width:900px){.editor{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <h1>HTML Visual Diff Demo</h1>
    <div style="margin-bottom: 6px;">
      <label for="textDiffGranularity">Text Diff Granularity:</label>
      <select id="textDiffGranularity" style="padding: 6px 10px; border-radius: 4px; border: 1px solid #d1d5db;">
        <option value="word">Word Level (Default)</option>
        <option value="char">Character Level</option>
      </select>
    </div>
    <div class="editor"><textarea id="oldHtml"></textarea><textarea id="newHtml"></textarea></div>
    <button id="compare">Compare</button>
    <div id="viewer"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
