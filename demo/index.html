<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Visual Diff Demo</title>
    <style>
      body{margin:0;padding:16px 20px;background:#edf1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
      .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
      .field{display:flex;flex-direction:column;gap:6px}
      textarea{width:100%;min-height:144px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:Consolas,Monaco,monospace;box-sizing:border-box;background:#fff}
      #viewer{height:70vh}
      button{margin-bottom:12px;padding:10px 16px;border:0;border-radius:999px;background:#1d4ed8;color:#fff;cursor:pointer}
      @media(max-width:900px){.grid{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <h1>Rendered HTML/CSS Diff Demo</h1>
    <div class="grid">
      <label class="field">
        <span>Old HTML</span>
        <textarea id="oldHtml"></textarea>
      </label>
      <label class="field">
        <span>New HTML</span>
        <textarea id="newHtml"></textarea>
      </label>
      <label class="field">
        <span>Old CSS</span>
        <textarea id="oldCss"></textarea>
      </label>
      <label class="field">
        <span>New CSS</span>
        <textarea id="newCss"></textarea>
      </label>
    </div>
    <button id="compare">Compare</button>
    <div id="viewer"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
